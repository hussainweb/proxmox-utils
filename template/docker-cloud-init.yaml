#cloud-config
hostname: ubuntu
manage_etc_hosts: true
fqdn: ubuntu
user: hw
password: $5$nMxnFZW2$enzzcGfpai4VIvBiMhas9yzefalm9LD9ozJC9FprEJD
ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKmYR+MsIXzdK7mpmE3iUdeFwtmXi9/3mn9ypMiCyW5B
  - ssh-rsa 
chpasswd:
  expire: False
users:
  - name: hw
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_import_id:
      - gh:hussainweb

package_update: true
package_upgrade: true

apt:
  preserve_sources_list: true
  sources:
    docker.list:
      source: deb [arch=amd64] https://download.docker.com/linux/ubuntu $RELEASE stable
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

packages:
  - qemu-guest-agent
  - sudo
  # Homebrew dependencies
  - build-essential
  - procps
  - file
  # Docker
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  # CLI tools
  - fish
  - bat
  - eza
  - eza-bash-completion
  - ripgrep
  - bottom
  - curl
  - httpie
  - git
  - git-delta
  - htop
  - btop
  - jq
  - unzip
  - vim
  - wget
  - xh
  - gnupg

runcmd:
  - [ chsh, -s, /usr/bin/fish, hw ]
  - [ usermod, -aG, docker, hw ]
  # Install Homebrew
  - su - hw -c 'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
  # Setup Homebrew for Fish
  - su - hw -c 'mkdir -p ~/.config/fish && echo "eval (/home/linuxbrew/.linuxbrew/bin/brew shellenv)" >> ~/.config/fish/config.fish'
  # Install chezmoi, 1Password CLI and initialize dotfiles
  - su - hw -c 'eval (/home/linuxbrew/.linuxbrew/bin/brew shellenv) && brew install chezmoi 1password-cli && chezmoi init hussainweb'
